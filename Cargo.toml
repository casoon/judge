[package]
name = "cargo-judge"
version = "0.7.0"
edition = "2024"
rust-version = "1.95"
description = "Deterministic post-refactoring analysis for Rust workspaces"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/casoon/judge"
homepage = "https://github.com/casoon/judge"
documentation = "https://docs.rs/cargo-judge"
keywords = ["cargo-plugin", "static-analysis", "code-quality", "complexity", "duplication"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
exclude = [".claude/**", ".judge/**", "judge-mcp/**", "todo.md"]
publish = true

[lib]
name = "judge"

[[bin]]
name = "cargo-judge"
path = "src/main.rs"

[features]
default = []
deep = [
    "dep:ra_ap_hir",
    "dep:ra_ap_ide",
    "dep:ra_ap_load-cargo",
    "dep:ra_ap_project_model",
    "dep:ra_ap_syntax",
    "dep:ra_ap_vfs",
]
network = ["dep:ureq"]

[dependencies]
cargo_metadata = "0.19"
clap = { version = "4.6.2", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
runemark = "0.1.1"
ra_ap_hir = { version = "=0.0.342", optional = true }
ra_ap_ide = { version = "=0.0.342", optional = true }
ra_ap_load-cargo = { version = "=0.0.342", optional = true }
ra_ap_project_model = { version = "=0.0.342", optional = true }
ra_ap_syntax = { version = "=0.0.342", optional = true }
ra_ap_vfs = { version = "=0.0.342", optional = true }
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
toml = "0.8"
ureq = { version = "3.3.0", optional = true }
